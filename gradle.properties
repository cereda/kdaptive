# Build performance. The project has two modules and a modest dependency
# graph, so parallel execution and the build cache pay for themselves without
# changing what the build produces.
org.gradle.parallel=true
org.gradle.caching=true

# The build daemon keeps the Kotlin compiler warm between builds. The heap is
# sized for the compiler and the Dokka generator, which are the two tasks
# that need it; the default heap is too small for them and makes the build
# crawl on the first run.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# The configuration cache: the build of this project is configuration-heavy
# and task-light, and the cache turns the configuration phase into a
# near-instant no-op on every run after the first.
org.gradle.configuration-cache=true

# Kotlin incremental compilation: the library and the examples are rebuilt
# together often enough for this to matter.
kotlin.incremental=true

# The official Kotlin style, the one the conventions of the language describe.
kotlin.code.style=official
