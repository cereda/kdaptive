# Build performance. The project has two modules and a modest dependency
# graph, so parallel execution and the build cache pay for themselves without
# changing what the build produces.
org.gradle.parallel=true
org.gradle.caching=true

# The build daemon keeps the Kotlin compiler warm between builds. The heap is
# sized for the compiler and the Dokka generator, which are the two tasks
# that need it; the default heap is too small for them and makes the build
# crawl on the first run.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# The configuration cache is OFF, on purpose.
#
# Spotless keeps the classloaders of its formatters in a cache that lives in
# the JVM of the daemon, and it *closes* them when the `clean` task runs. The
# Gradle configuration cache, on the other hand, keeps a reference to those
# classloaders across builds. The two together are a trap: the build reuses a
# configuration cache entry that points at a classloader the previous `clean`
# closed, and ktlint then fails with an `InvocationTargetException` that
# hides the real cause (`NoClassDefFoundError` on a closed classloader).
#
# The failure is intermittent — roughly two builds in three — and it hits the
# formatting gate, which is the one gate that must never lie. The workaround
# upstream is not ours to choose: fixing it here means removing an action
# Spotless registers on the `clean` task, which depends on the internals of
# both Gradle and Spotless and would fail silently the day either of them
# changes.
#
# What the cache buys here is small: about three seconds on a full rebuild and
# half a second on an incremental one. A gate that fails at random is a much
# worse property than a configuration phase that takes three seconds longer.
#
# When Spotless stops closing classloaders the configuration cache outlives
# (diffplug/spotless#987), this line goes away with the comment above it.
org.gradle.configuration-cache=false

# Kotlin incremental compilation: the library and the examples are rebuilt
# together often enough for this to matter.
kotlin.incremental=true

# The official Kotlin style, the one the conventions of the language describe.
kotlin.code.style=official
